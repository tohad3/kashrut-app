<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>ניהול כשרות – מחלקת הכשרות</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b3a5b">
<style>
  html, body { margin: 0; height: 100%; background: #f3f6f9; font-family: Arial, sans-serif; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  .msg { max-width: 520px; margin: 80px auto; padding: 24px; text-align: center; color: #17222d; }
</style>
</head>
<body>
<script>
  // דף עוטף: פותח את המערכת (Google Apps Script) בתוך מסגרת, כך שהודעת Google לא מוצגת. הקישור האישי (k) מועבר כמו שהוא.
  var APP = 'https://script.google.com/macros/s/AKfycbyi1fq6qdmE0CfR6rfr4FUS4RQcDNuQEKRLZ_y8VKmiwqaqqMRl1q7ggzKu_gt4CdaE/exec';
  var k = new URLSearchParams(location.search).get('k') || '';
  if (/^[0-9a-f]{20,}$/i.test(k)) {
    var f = document.createElement('iframe');
    f.src = APP + '?k=' + encodeURIComponent(k);
    f.title = 'ניהול כשרות';
    f.allow = 'clipboard-write; geolocation';
    document.body.appendChild(f);
  } else {
    document.body.innerHTML = '<div class="msg"><h2>הקישור אינו תקף</h2><p>לכניסה למערכת יש להשתמש בקישור האישי שנשלח אליכם במייל ממחלקת הכשרות.</p></div>';
  }
</script>
</body>
</html>
